<h2>怎么用</h2>
<div class="gist">
  <p><strong>1. 先看页面上半部分</strong>（这一章在做什么、背景、图），两三分钟，知道要读到什么。</p>
  <p><strong>2. 读原书这一章。</strong>卡住了再来查「词与短语」，词条按书里出现的顺序排。</p>
  <p><strong>3. 读完做「检查一下理解」</strong>，然后标记读完。</p>
  <p>全书 4 万词出头，章节很短。目录里每章标了难度：物理名词密集的是第 1、2、4、8、9、11、13 章，其余各章主要难在口语和俚语。</p>
</div>
